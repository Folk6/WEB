<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MoneyFlow</title>

  <!-- Tailwind CSS ผ่าน CDN ไม่ต้องติดตั้งอะไรเพิ่ม -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Chart.js ผ่าน CDN ใช้วาดกราฟโดนัทและกราฟแท่ง -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

  <!-- ฟอนต์ไทย Noto Sans Thai จาก Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    /* ตั้งฟอนต์ไทยให้ทั้งหน้าเว็บ */
    body {
      font-family: "Noto Sans Thai", sans-serif;
    }
  </style>
</head>

<!--
  พื้นหลังสีเทาอ่อนทั้งหน้า
  padding-bottom เผื่อพื้นที่ด้านล่างไว้ให้ไม่โดนแถบเมนูล่าง (bottom nav) บัง
-->
<body class="bg-gray-100 min-h-screen pb-24">

  <!-- ================= Header ================= -->
  <!-- แถบหัวข้อด้านบนสุด แสดงชื่อแอปชิดซ้าย -->
  <header class="bg-white shadow-sm px-4 py-4">
    <h1 class="text-xl font-bold text-gray-800">MoneyFlow</h1>
  </header>

  <!-- เนื้อหาหลักของหน้า จำกัดความกว้างสูงสุดไว้เผื่อเปิดบนจอใหญ่ -->
  <main class="max-w-md mx-auto px-4 mt-4 space-y-4">

    <!-- ================= View: หน้าแรก (Dashboard) ================= -->
    <!-- script.js จะสลับ hidden ให้ view นี้กับ view-transactions ตามแท็บที่กด -->
    <div id="view-home">

      <!-- ================= การ์ดสรุปงบประมาณ ================= -->
      <!-- ตัวเลขทั้งหมดในการ์ดนี้ script.js จะคำนวณจากข้อมูลจริงแล้วเติมให้ (ดูฟังก์ชัน renderDashboardSummary) -->
      <section class="bg-white rounded-2xl shadow-sm p-5 text-center">
        <div class="flex items-center justify-center gap-1">
          <p class="text-sm text-gray-500">งบที่เหลือเดือนนี้</p>
          <!-- ปุ่มดินสอ กดแล้วเปิดกล่องให้กรอกงบประมาณใหม่ -->
          <button
            id="edit-budget-btn"
            type="button"
            class="text-gray-400 hover:text-blue-600 text-sm leading-none"
            aria-label="ตั้งงบประมาณ"
          >
            ✏️
          </button>
        </div>

        <!-- ตัวเลขใหญ่ตรงกลาง เริ่มต้นว่างไว้ก่อน รอ script.js เติมให้ -->
        <p id="budget-remaining-text" class="text-4xl font-bold text-gray-800 mt-1">-</p>

        <!-- แถบ progress bar แสดงสัดส่วนงบที่ใช้ไปแล้ว สีจะเปลี่ยนตามเปอร์เซ็นต์ที่ใช้ -->
        <div class="w-full bg-gray-200 rounded-full h-3 mt-4 overflow-hidden">
          <div id="budget-progress-bar" class="bg-gray-300 h-3 rounded-full" style="width: 0%"></div>
        </div>

        <p id="daily-allowance-text" class="text-sm text-gray-500 mt-2"></p>
      </section>

      <!-- ================= แถวสรุปรายรับ / รายจ่าย ================= -->
      <!-- ยอดรวมของ "เดือนปัจจุบัน" เท่านั้น (ไม่ใช่ยอดรวมทั้งหมดตั้งแต่เริ่มใช้แอป) -->
      <section class="grid grid-cols-2 gap-4 mt-4">
        <!-- รายรับรวม สีเขียว -->
        <div class="bg-white rounded-2xl shadow-sm p-4 text-center">
          <p class="text-sm text-gray-500">รายรับรวม</p>
          <p id="income-total" class="text-lg font-semibold text-green-600 mt-1">+0.00 ฿</p>
        </div>

        <!-- รายจ่ายรวม สีแดง -->
        <div class="bg-white rounded-2xl shadow-sm p-4 text-center">
          <p class="text-sm text-gray-500">รายจ่ายรวม</p>
          <p id="expense-total" class="text-lg font-semibold text-red-600 mt-1">-0.00 ฿</p>
        </div>
      </section>

      <!-- ================= รายการล่าสุด ================= -->
      <section class="bg-white rounded-2xl shadow-sm p-4 mt-4">
        <h2 class="text-base font-semibold text-gray-800 mb-3">รายการล่าสุด</h2>

        <!-- ul นี้เริ่มว่างเปล่า แล้วให้ script.js เติมรายการจริงจาก localStorage ให้ -->
        <ul id="recent-list" class="divide-y divide-gray-100"></ul>
      </section>

      <!-- ================= กราฟสัดส่วนรายจ่ายตามหมวดหมู่ (เดือนนี้) ================= -->
      <section class="bg-white rounded-2xl shadow-sm p-4 mt-4">
        <h2 class="text-base font-semibold text-gray-800 mb-3">รายจ่ายตามหมวดหมู่ (เดือนนี้)</h2>

        <!-- ยังไม่มีรายจ่ายในเดือนนี้เลย -> โชว์ข้อความนี้แทนกราฟที่วาดไม่ได้ -->
        <p id="expense-chart-empty" class="text-center text-sm text-gray-400 py-6 hidden">
          ยังไม่มีรายจ่ายในเดือนนี้
        </p>

        <div id="expense-chart-wrapper">
          <canvas id="expense-doughnut-chart" height="220"></canvas>

          <!-- legend สร้างเองด้วย JS แทนของ Chart.js เพื่อคุมสีให้ตรงกับ colors.js เป๊ะ ๆ -->
          <ul id="expense-chart-legend" class="mt-4 space-y-1"></ul>
        </div>

        <!-- ประโยคสรุปที่คำนวณจากข้อมูลจริง เช่น หมวดที่ใช้จ่ายเยอะที่สุด -->
        <p id="expense-chart-summary" class="text-sm text-gray-500 text-center mt-3"></p>
      </section>

    </div>

    <!-- ================= View: รายการทั้งหมด ================= -->
    <!-- เริ่มต้นซ่อนไว้ด้วย class "hidden" script.js จะเป็นคนสั่งแสดง/ซ่อน -->
    <div id="view-transactions" class="hidden">
      <h2 class="text-lg font-bold text-gray-800 mb-3">รายการทั้งหมด</h2>

      <!-- ตรงนี้ script.js จะสร้างกลุ่มรายการแยกตามวันที่ให้ทั้งหมด -->
      <div id="all-transactions-list"></div>
    </div>

    <!-- ================= View: รายงาน ================= -->
    <div id="view-reports" class="hidden">
      <h2 class="text-lg font-bold text-gray-800 mb-3">รายงาน</h2>

      <!-- ปุ่มเลือกช่วงเวลา ปุ่มแรก "เดือนนี้" เป็นค่าเริ่มต้น (active) -->
      <div class="grid grid-cols-4 gap-2 mb-4">
        <button type="button" class="report-range-btn py-2 rounded-xl text-xs font-semibold bg-blue-600 text-white" data-range="month">เดือนนี้</button>
        <button type="button" class="report-range-btn py-2 rounded-xl text-xs font-semibold bg-gray-100 text-gray-500" data-range="3m">3 เดือน</button>
        <button type="button" class="report-range-btn py-2 rounded-xl text-xs font-semibold bg-gray-100 text-gray-500" data-range="6m">6 เดือน</button>
        <button type="button" class="report-range-btn py-2 rounded-xl text-xs font-semibold bg-gray-100 text-gray-500" data-range="year">ปีนี้</button>
      </div>

      <section class="bg-white rounded-2xl shadow-sm p-4">
        <h3 class="text-base font-semibold text-gray-800 mb-3">เปรียบเทียบรายรับ-รายจ่าย</h3>

        <p id="report-chart-empty" class="text-center text-sm text-gray-400 py-6 hidden">
          ยังไม่มีข้อมูลในช่วงเวลานี้
        </p>

        <canvas id="report-bar-chart" height="240"></canvas>

        <!-- ประโยคสรุปที่คำนวณจากข้อมูลจริงของช่วงเวลาที่เลือก -->
        <p id="report-chart-summary" class="text-sm text-gray-500 text-center mt-3"></p>
      </section>
    </div>

  </main>

  <!-- ================= ปุ่มลอย (Floating Action Button) ================= -->
  <!--
    ปุ่มวงกลมลอยมุมขวาล่าง ไว้กดเพิ่มรายการใหม่
    fixed = ลอยอยู่กับที่แม้เลื่อนหน้าจอ, วางไว้เหนือแถบเมนูล่าง (bottom-24)
  -->
  <button
    id="fab-button"
    class="fixed bottom-24 right-5 w-14 h-14 rounded-full bg-blue-600 text-white text-3xl leading-none shadow-lg flex items-center justify-center hover:bg-blue-700 transition"
    aria-label="เพิ่มรายการใหม่"
  >
    +
  </button>

  <!-- ================= แถบเมนูล่างสุด (Bottom Navigation) ================= -->
  <!-- fixed ให้ติดขอบล่างของจอตลอดเวลา มี 4 ปุ่มหลักของแอป -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around items-center py-2">
    <button id="nav-home-btn" class="flex flex-col items-center text-blue-600 text-xs">
      <span class="text-lg">🏠</span>
      หน้าแรก
    </button>
    <button id="nav-list-btn" class="flex flex-col items-center text-gray-400 text-xs">
      <span class="text-lg">📋</span>
      รายการ
    </button>
    <button id="nav-report-btn" class="flex flex-col items-center text-gray-400 text-xs">
      <span class="text-lg">📊</span>
      รายงาน
    </button>
    <button class="flex flex-col items-center text-gray-400 text-xs">
      <span class="text-lg">⚙️</span>
      ตั้งค่า
    </button>
  </nav>

  <!-- ================= Modal ฟอร์มเพิ่มรายการ ================= -->
  <!--
    ฉากหลังสีดำโปร่งแสง (overlay) ครอบทั้งจอ + กล่องฟอร์มด้านล่าง
    ซ่อนไว้ก่อนด้วย class "hidden" ของ Tailwind แล้วให้ script.js เป็นคนสั่งเปิด/ปิด
  -->
  <div
    id="modal-overlay"
    class="hidden fixed inset-0 bg-black/50 z-40 flex items-end justify-center"
  >
    <div class="bg-white w-full max-w-md rounded-t-2xl p-5 max-h-[90vh] overflow-y-auto">

      <!-- หัวข้อ modal + ปุ่มปิด -->
      <div class="flex items-center justify-between mb-4">
        <h2 id="modal-title" class="text-lg font-bold text-gray-800">เพิ่มรายการ</h2>
        <button id="modal-close-btn" type="button" class="text-gray-400 text-2xl leading-none">
          &times;
        </button>
      </div>

      <form id="transaction-form">
        <!-- ปุ่มสลับ รายจ่าย / รายรับ -->
        <div class="grid grid-cols-2 gap-2 mb-4">
          <button type="button" id="type-expense-btn" data-type="expense" class="py-2 rounded-xl font-semibold">
            รายจ่าย
          </button>
          <button type="button" id="type-income-btn" data-type="income" class="py-2 rounded-xl font-semibold">
            รายรับ
          </button>
        </div>

        <!-- ช่องกรอกจำนวนเงิน หน่วยเป็น "บาท" ตามปกติ (เช่น 125.50) -->
        <!-- ตอนบันทึกจริง script.js จะแปลงเป็นสตางค์ให้เอง -->
        <div class="mb-4 text-center">
          <label class="text-sm text-gray-500" for="amount-input">จำนวนเงิน (บาท)</label>
          <input
            type="number"
            id="amount-input"
            step="0.01"
            min="0"
            placeholder="0.00"
            class="w-full text-center text-3xl font-bold text-gray-800 mt-1 outline-none border-b-2 border-gray-200 focus:border-blue-500 py-2"
          />
        </div>

        <!-- กริดเลือกหมวดหมู่ ตัวปุ่มทั้งหมดถูกสร้างด้วย JavaScript ใน script.js -->
        <div class="mb-4">
          <label class="text-sm text-gray-500 mb-2 block">หมวดหมู่</label>
          <div id="category-grid" class="grid grid-cols-3 gap-2"></div>
        </div>

        <!-- ช่องวันที่ (ค่าเริ่มต้นเป็นวันนี้ ตั้งค่าโดย script.js) -->
        <div class="mb-4">
          <label class="text-sm text-gray-500 mb-1 block" for="date-input">วันที่</label>
          <input
            type="date"
            id="date-input"
            class="w-full border border-gray-200 rounded-xl px-3 py-2 outline-none focus:border-blue-500"
          />
        </div>

        <!-- ช่องโน้ต ไม่บังคับกรอก -->
        <div class="mb-5">
          <label class="text-sm text-gray-500 mb-1 block" for="note-input">โน้ต (ไม่บังคับ)</label>
          <input
            type="text"
            id="note-input"
            placeholder="เช่น ค่ากาแฟที่ร้าน..."
            class="w-full border border-gray-200 rounded-xl px-3 py-2 outline-none focus:border-blue-500"
          />
        </div>

        <!-- ปุ่มบันทึก: type="submit" เพื่อให้กด Enter ในฟอร์มก็บันทึกได้ -->
        <button
          type="submit"
          class="w-full bg-blue-600 text-white font-semibold py-3 rounded-xl hover:bg-blue-700 transition"
        >
          บันทึก
        </button>
      </form>
    </div>
  </div>

  <!-- เชื่อมไฟล์ JavaScript ไว้ท้ายสุดของ body เพื่อให้มั่นใจว่า element ทั้งหมดถูกสร้างในหน้าแล้ว -->
  <!-- colors.js ต้องมาก่อน script.js เพราะ script.js เรียกใช้ getCategoryColor() จากไฟล์นั้น -->
  <script src="colors.js"></script>
  <script src="script.js"></script>
</body>
</html>
